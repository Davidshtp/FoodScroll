name: feedgo-infrastructure

services:
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: feedgo-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-feedgo}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - feedgo-infra

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: feedgo-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - feedgo-infra

  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: feedgo-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_EXTERNAL_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: admin
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - feedgo-infra

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: feedgo-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_EXTERNAL_BOLT:-7687}:7687"
      - "${NEO4J_EXTERNAL_HTTP:-7474}:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP:-1024M}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - feedgo-infra

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: feedgo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - feedgo-infra

networks:
  feedgo-infra:
    name: feedgo-infra
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"

volumes:
  mysql_data:
    name: feedgo-mysql-data
  postgres_data:
    name: feedgo-postgres-data
  mongodb_data:
    name: feedgo-mongodb-data
  neo4j_data:
    name: feedgo-neo4j-data
  neo4j_logs:
    name: feedgo-neo4j-logs
  redis_data:
    name: feedgo-redis-data
